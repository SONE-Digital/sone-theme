<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ theme.brand }} Style Guide</title>
    <link rel="stylesheet" href="../../assets/css/lexjet-theme.css" />
  </head>
  <body class="bg-white text-text font-sans p-10 space-y-8">
    <div class="py-8"></div>

    <section class="max-w-[1200px] mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="bg-primary text-white py-6 px-8">
        <h2 class="text-3xl font-bold text-center">TYPOGRAPHY</h2>
      </div>
      <div class="px-8 py-8 space-y-8">
        {{ typographySection }}
      </div>
      
    </section>
    

    <section
      class="max-w-[1200px] mx-auto bg-white rounded-lg shadow-lg overflow-hidden"
    >
      <div class="bg-primary text-white py-6 px-8">
        <h2 class="text-3xl font-bold text-center">COLORS</h2>
      </div>

      <div
        class="px-8 py-8 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
      >
        <div class="bg-primary">
          Primary
        </div>
        <div class="bg-secondary">
          Secondary
        </div>
        <div class="bg-success">
          Success
        </div>
        <div class="bg-warning">
          Warning
        </div>
        <div class="bg-danger">
          Danger
        </div>
        <div class="bg-info">
          Info
        </div>
      </div>

      {{ colorPaletteGrid }}

      </div>
    </section>
    <section
    class="max-w-[1200px] mx-auto bg-white rounded-lg shadow-lg overflow-hidden"
  >
    <div class="bg-primary text-white py-6 px-8">
      <h2 class="text-3xl font-bold text-center">BUTTONS</h2>
    </div>
  
    <div
      class="px-8 py-8 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
    >
      <div class="flex flex-col items-center space-y-4">
        <button class="btn btn-primary">ADD TO CART</button>
        <span class="text-sm text-gray-500">Primary</span>
      </div>
  
      <div class="flex flex-col items-center space-y-4">
        <button class="btn btn-secondary">CALL TO ACTION</button>
        <span class="text-sm text-gray-500">Secondary</span>
      </div>
  
      <div class="flex flex-col items-center space-y-4">
        <a href="/" class="btn btn-link">ABOUT</a>
        <span class="text-sm text-gray-500">Link</span>
      </div>
    </div>
  </section>
  

    <section class="max-w-[1200px] mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="bg-primary text-white py-6 px-8">
        <h2 class="text-3xl font-bold text-center">FORMS</h2>
      </div>
      <div class="px-8 py-8 flex justify-center">
        <form class="space-y-4 max-w-md w-full">
          <div>
            <label class="block text-sm font-medium text-heading mb-1" for="name"
              >Name</label
            >
            <input
              type="text"
              id="name"
              class="w-full border border-border p-2 rounded"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-heading mb-1" for="email"
              >Email</label
            >
            <input
              type="email"
              id="email"
              class="w-full border border-border p-2 rounded"
            />
          </div>
          <div>
            <label
              class="block text-sm font-medium text-heading mb-1"
              for="message"
              >Message</label
            >
            <textarea
              id="message"
              class="w-full border border-border p-2 rounded"
              rows="4"
            ></textarea>
          </div>
          <div class="text-center">
            <button
              type="submit"
              class="px-4 py-2 bg-primary text-white rounded font-medium"
            >
              Submit
            </button>
          </div>
        </form>
      </div>
    </section>

    <section class="max-w-[1200px] mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="bg-primary text-white py-6 px-8">
        <h2 class="text-3xl font-bold text-center">COMPONENTS</h2>
      </div>
      <div class="px-8 py-8 space-y-8">
        
        <div class="space-y-4">
          <h3 class="text-h3 text-center">Header</h3>
          <div class="border border-gray-200 rounded-lg overflow-hidden">
            {{headerComponent}}
          </div>
        </div>
        
        <div class="space-y-4">
          <h3 class="text-h3 text-center">Footer</h3>
          <div class="border border-gray-200 rounded-lg overflow-hidden">
            {{footerComponent}}
          </div>
        </div>
        
      </div>
    </section>
  </body>
</html>
